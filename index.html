<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKX Store</title>
<style>
:root{--bg:#081428;--bg2:#0d2347;--card:rgba(16,38,74,.78);--tx:#e6f2ff;--mut:#8fb0d4;--pri:#59c3ff;--pri2:#3a86ff;--red:#ff6f7a;--ok:#3fd69b;--bd:rgba(110,180,255,.18);--sh:0 10px 30px rgba(0,8,24,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px;line-height:1.5;color:var(--tx);background-color:var(--bg);background-image:radial-gradient(70% 45% at 90% 0%,rgba(58,134,255,.28),transparent),radial-gradient(60% 40% at 0% 8%,rgba(89,195,255,.16),transparent)}
#app{max-width:460px;margin:0 auto;padding:16px 14px 44px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
h1{font-size:26px;font-weight:700;text-align:center;margin:64px 0 6px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--tx)}
.center{text-align:center}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--bd);margin:14px 0 6px}
.tab{flex:1;padding:9px;border-radius:11px;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 12px rgba(80,130,255,.35)}
input{width:100%;padding:11px 13px;margin:5px 0;border-radius:12px;border:1px solid var(--bd);background:rgba(127,160,200,.08);color:var(--tx);font:inherit;outline:0;transition:.2s}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(61,155,255,.18)}
button.b{width:100%;padding:11px;margin-top:8px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(80,130,255,.28);transition:.2s}
button.b:hover{transform:translateY(-1px)}
button.b.g{background:transparent;color:var(--pri);border:1px solid var(--bd);box-shadow:none}
button.b.r{background:var(--red)}
button.b.ok{background:linear-gradient(135deg,#19b57c,#16a870)}
button.s{padding:6px 12px;border-radius:99px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.red{color:var(--red);font-size:11px;margin-top:6px}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);padding:2px 4px}
.top button{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;cursor:pointer}
.big{font-size:18px;font-weight:700;letter-spacing:.5px}
.game{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;margin:6px 0;border-radius:14px;border:1px solid var(--bd);background:rgba(127,160,200,.07);color:var(--tx);font:inherit;cursor:pointer;text-align:start;transition:.2s}
.game:hover{border-color:var(--pri);transform:translateY(-1px)}
.pill{padding:3px 10px;border-radius:99px;background:rgba(89,195,255,.16);color:var(--pri);font-size:11px;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on{display:flex}
#modal .card{width:100%;max-width:360px;background:var(--bg)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:12px;z-index:30}
.status-wait{color:#d98a00}.status-ok{color:var(--ok)}.status-no{color:var(--red)}
.seg{display:inline-flex;padding:2px;border-radius:99px;background:rgba(110,180,255,.12);margin-inline-end:8px}.seg button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.sw{display:flex;gap:6px}.sw button{flex:1}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
let OF=[],draft={g:"",q:"",p:"",img:""},db=null,user=null,isOwner=false,U={},O=[],S={maintenance:false,mode:"manual"},DR=[];
let mode="cust",ready=false,me=null,view="welcome",role="cust",notDist=false,ownerOpen=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=e=>e.trim().toLowerCase().replace(/[^a-z0-9]/g,"_");
async function hash(e,p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(e.trim().toLowerCase()+":"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function newId(len){const lo=10**(len-1);for(let i=0;i<200;i++){const n=String(lo+Math.floor(Math.random()*9*lo));if(!Object.values(U).some(u=>u.id===n))return n}return String(Date.now()).slice(-len)}
function modal(h){const m=$("#modal");if(!h){m.className="";m.innerHTML="";return}m.innerHTML='<div class="card">'+h+'</div>';m.className="on"}
function save(k){try{k?sessionStorage.setItem("s",k):sessionStorage.removeItem("s")}catch(e){}}

function render(){
 if(!db&&ready){$("#app").innerHTML='<h1>أهلاً وسهلاً!</h1><div class="card center">الموقع مو مربوط بقاعدة البيانات بعد. عدّل ملف config.js (اتبع ملف التعليمات).</div>';return}
 if(me&&!U[me]){$("#app").innerHTML='<div class="center mut" style="margin-top:90px">جاري التحميل…<br><br><button class="s" onclick="logout()">خروج</button></div>';return}
 const u=me?U[me]:null;
 if(view==="welcome")return $("#app").innerHTML='<h1>أهلاً وسهلاً!</h1><p class="center mut" style="margin-bottom:22px">AKX Store · شحن ألعاب بسرعة وأمان</p><button class="b" onclick="go(\'login\')">ابدأ</button>';
 if(view==="login"||view==="signup")return authView();
 if(ownerOpen&&isOwner)return ownerView();
 if(u&&u.role==="dist"&&u.approved&&mode==="dist")return distView(u);
 if(u)return custView(u);
}
function go(v){view=v;notDist=false;render()}
function authView(){
 const su=view==="signup";
 $("#app").innerHTML=`<h1>${su?"حساب جديد":"تسجيل دخول"}</h1>
 ${su?"":`<div class="tabs"><button class="tab ${role==="cust"?"on":""}" onclick="setRole('cust')">عميل</button><button class="tab ${role==="dist"?"on":""}" onclick="setRole('dist')">موزع نقاط</button></div>`}
 <div class="card"><input id="em" type="email" placeholder="الايميل" autocomplete="email"><input id="pw" type="password" placeholder="الباسورد" autocomplete="${su?"new-password":"current-password"}">
 ${notDist&&role==="dist"&&!su?'<div class="red">الحساب غير موزع</div>':""}
 <button class="b" onclick="${su?"signup()":"login()"}">${su?"إنشاء حساب":"دخول"}</button>
 ${role==="cust"||su?`<button class="b g" onclick="go('${su?"login":"signup"}')">${su?"عندي حساب":"حساب جديد"}</button>`:""}</div>`;
}
function setRole(r){role=r;notDist=false;authView()}
function authErr(x){const c=(x&&x.code)||"";if(c==="auth/email-already-in-use")return"الحساب موجود، سجل دخول";if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c))return"الايميل أو الباسورد غلط";if(c==="auth/weak-password")return"الباسورد ضعيف";if(c==="auth/too-many-requests")return"محاولات كتير، جرب بعد شوي";console.error(x);return"صار خطأ ("+(c||(x&&x.message)||"")+")"}
async function signup(){
 const e=$("#em").value.trim(),p=$("#pw").value;
 if(!/^\S+@\S+\.\S+$/.test(e))return toast("الايميل غير صحيح");
 if(p.length<6)return toast("الباسورد 6 أحرف على الأقل");
 busy=true;
 try{
  const c=await auth.createUserWithEmailAndPassword(e,p);
  await ensureUser(c.user.uid,e);
  busy=false;onUser(c.user);
 }catch(x){busy=false;toast(authErr(x))}
}
async function ensureUser(uid,email){
 const r=db.doc("users/"+uid),d=await r.get();if(d.exists)return;
 for(let i=0;i<60;i++){const id=String(1000+Math.floor(Math.random()*9000));
  try{await db.doc("ids/"+id).set({k:uid})}catch(x){continue}
  await r.set({email,role:"cust",approved:false,id,points:0,t:Date.now()});return}
 throw new Error("تعذر إنشاء المعرف")
}
async function login(){
 const e=$("#em").value.trim(),p=$("#pw").value;
 if(!e||!p)return toast("اكتب الايميل والباسورد");
 busy=true;
 try{
  const c=await auth.signInWithEmailAndPassword(e,p),uid=c.user.uid;
  await ensureUser(uid,e);
  if(role==="dist"){
   const d=await db.doc("users/"+uid).get(),u=d.exists?d.data():null;
   if(!(u&&u.role==="dist"&&u.approved)){
    try{await db.doc("distreq/"+uid).set({email:e,t:Date.now()})}catch(x){}
    await auth.signOut();busy=false;notDist=true;return render();
   }
  }
  mode=role==="dist"?"dist":"cust";busy=false;onUser(c.user);
 }catch(x){busy=false;toast(authErr(x))}
}
function logout(){ownerOpen=false;auth.signOut()}
function setMode(m){mode=m;render()}
function switcher(u){return u.role==="dist"&&u.approved?`<span class="seg"><button class="${mode==="cust"?"on":""}" onclick="setMode('cust')">العميل</button><button class="${mode==="dist"?"on":""}" onclick="setMode('dist')">الموزع</button></span>`:""}
function ownerBtn(){return isOwner?`<button onclick="ownerOpen=!ownerOpen;render()">${ownerOpen?"رجوع":"لوحة المالك"}</button>`:""}

function custView(u){
 const mine=O.filter(o=>o.ck===me).sort((a,b)=>b.t-a.t);
 $("#app").innerHTML=`<div class="top"><span>${esc(u.email)}</span><span>${switcher(u)}${ownerBtn()} <button onclick="logout()">خروج</button></span></div>
 <div class="card"><div class="row" style="align-items:flex-start"><div><div class="mut">رصيدك الحالي</div><div class="big" style="font-size:28px">${u.points||0}</div><div class="mut">نقطة</div></div>
 <div style="text-align:end"><div style="font-weight:700">معرف الحساب</div><div class="mut" style="max-width:150px">(اعطيه للموزع مشان يشحنلك نقاط)</div></div></div>
 <div class="row" style="margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(110,180,255,.10)"><div><span class="mut">معرف الحساب:</span> <span class="big">${esc(u.id)}</span></div><button class="s" onclick="copyId('${esc(u.id)}')">نسخ</button></div>
 <div class="red">سعر الـ50 نقطة دولار واحد</div></div>
 <div class="card"><h2>شحناتك المسبقة</h2>${mine.length?mine.map(o=>`<div class="row" style="padding:6px 0"><span>${esc(o.game)} · ${esc(o.qty)}</span><span class="${o.st==="تم الشحن"?"status-ok":o.st==="مرفوض"?"status-no":"status-wait"}">${esc(o.st)}</span></div>`).join(""):'<div class="center mut">شو مستني يلا اشحن!!</div>'}</div>
 <div class="card"><h2>الألعاب</h2>${OF.length?OF.map(o=>`<button class="game" onclick="pick('${o.id}')"><span class="row" style="justify-content:flex-start">${o.img?`<img src="${o.img}" alt="" style="width:42px;height:42px;border-radius:10px;object-fit:cover">`:""}<span>${esc(o.g)}<br><span class="mut">${esc(o.q)} جوهرة</span></span></span><span class="pill">${o.p} نقطة</span></button>`).join(""):'<div class="mut center">ما في عروض حالياً</div>'}</div>`;
}
function copyId(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("تم نسخ المعرف"),()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("تم نسخ المعرف")}catch(e){toast(t)}a.remove()})}
function pick(i){
 if(S.maintenance)return modal('<div class="center big">جاري الصيانة</div><button class="b" onclick="modal()">حسناً</button>');
 const g=OF.find(x=>x.id===i),u=U[me];if(!g)return;
 if((u.points||0)<g.p)return toast("نقاطك ما بتكفي");
 modal(`<h2>${esc(g.g)} · ${esc(g.q)} جوهرة</h2><div class="mut">السعر: ${g.p} نقطة</div><input id="pid" placeholder="حط الايدي" inputmode="numeric"><button class="b" onclick="confirmId('${i}')">متابعة</button><button class="b g" onclick="modal()">إلغاء</button>`);
}
function confirmId(i){
 const id=$("#pid").value.trim();if(!id)return toast("حط الايدي");window._pid=id;
 modal(`<h2>هل أنت متأكد من الايدي؟</h2><div class="center big">${esc(id)}</div><div class="red" style="font-size:12px;margin:8px 0">لأنه بعد الطلب ما فينا نرجع النقاط</div>
 <button class="b g" onclick="pick('${i}')">برجع بعدل</button><button class="b ok" onclick="order('${i}')">إي متأكد!!</button>`);
}
async function order(i){
 const pid=window._pid||"";modal();if(S.maintenance)return toast("جاري الصيانة");
 const g=OF.find(x=>x.id===i),u=U[me];if(!g)return;if((u.points||0)<g.p)return toast("نقاطك ما بتكفي");
 const st=S.mode==="auto"?"تم الشحن":"جاري الإرسال";
 await db.doc("users/"+me).update({points:(u.points||0)-g.p});
 await db.collection("orders").add({ck:me,cid:u.id,game:g.g,qty:g.q+" جوهرة",pts:g.p,pid,st,t:Date.now()});
 toast("تم إرسال طلبك");
}

function distView(u){
 const spent=O.filter(o=>o.st!=="مرفوض").reduce((a,o)=>a+o.pts,0);
 const list=[...O].sort((a,b)=>b.t-a.t);
 $("#app").innerHTML=`<div class="top"><span>الموزع · ${esc(u.email)}</span><span>${switcher(u)}${ownerBtn()} <button onclick="logout()">خروج</button></span></div>
 <div class="card center"><div><span class="mut">المعرف:</span> <span class="big">${esc(u.id)}</span></div><div><span class="mut">عدد النقاط:</span> <span class="big">${u.points||0}</span></div></div>
 <div class="card"><div class="row"><h2 style="margin:0">تفعيل وضع الصيانة</h2><button class="s" onclick="setS({maintenance:${!S.maintenance}})">${S.maintenance?"إيقاف":"تفعيل"}</button></div>
 <div class="mut" style="margin-top:6px">ملاحظة: بعد تفعيل وضع الصيانة، أول ما يدخل الشخص ليشحن بيكتبله "جاري الصيانة".</div></div>
 <div class="card"><h2>الطلبات الواردة</h2><div class="sw"><button class="tab ${S.mode==="manual"?"on":""}" onclick="setS({mode:'manual'})">جاري التحميل (أنا بوافق)</button><button class="tab ${S.mode==="auto"?"on":""}" onclick="setS({mode:'auto'})">قبول تلقائي</button></div><div class="mut" style="margin-top:6px">بتقدر ترفض أي طلب أو تقبله من القائمة تحت.</div></div>
 <div class="card"><h2>عدد النقاط التي صرفها الناس: ${spent}</h2></div>
 <div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">عمليات الشحن</h2>${list.length?`<button class="s" style="background:var(--red)" onclick="delAll()">حذف كل الطلبات</button>`:""}</div>${list.length?list.map(o=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div><b>المعرف: ${esc(o.pid)}</b> · ${esc(o.game)} · ${esc(o.qty)}</div><div class="row"><span>عدد النقاط: ${o.pts}</span><span class="${o.st==="تم الشحن"?"status-ok":o.st==="مرفوض"?"status-no":"status-wait"}">${esc(o.st)}</span></div>
 ${o.st==="جاري الإرسال"?`<div class="sw" style="margin-top:6px"><button class="s" style="background:var(--ok)" onclick="decide('${o.id}',true)">قبول</button><button class="s" style="background:var(--red)" onclick="decide('${o.id}',false)">رفض</button></div>`:""}</div>`).join(""):'<div class="mut center">ما في طلبات</div>'}</div>
 <div class="card"><h2>إضافة عرض شحن</h2>
 <input placeholder="اسم اللعبة" value="${esc(draft.g)}" oninput="draft.g=this.value">
 <input placeholder="كمية الجواهر" inputmode="numeric" value="${esc(draft.q)}" oninput="draft.q=this.value">
 <input placeholder="كمية النقاط (السعر)" inputmode="numeric" value="${esc(draft.p)}" oninput="draft.p=this.value">
 <input type="file" accept="image/*" onchange="pickImg(this.files[0])">
 <img id="prev" alt="" src="${draft.img}" style="display:${draft.img?"block":"none"};width:64px;height:64px;border-radius:12px;object-fit:cover;margin-top:6px">
 <button class="b" onclick="addOffer()">إضافة العرض</button></div>
 <div class="card"><h2>العروض الحالية</h2>${OF.length?OF.map(o=>`<div class="row" style="padding:6px 0"><span class="row" style="justify-content:flex-start">${o.img?`<img src="${o.img}" alt="" style="width:36px;height:36px;border-radius:9px;object-fit:cover">`:""}<span>${esc(o.g)} · ${esc(o.q)} جوهرة · ${o.p} نقطة</span></span><button class="s" style="background:var(--red)" onclick="delOffer('${o.id}')">حذف</button></div>`).join(""):'<div class="mut center">ما في عروض</div>'}</div>
 <div class="card"><h2>إضافة نقاط لعميل</h2><input id="aid" placeholder="معرف العميل" inputmode="numeric"><input id="apt" placeholder="عدد النقاط" inputmode="numeric"><button class="b" onclick="addPts()">إضافة</button></div>`;
}
function pickImg(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);draft.img=c.toDataURL("image/jpeg",.8);const p=$("#prev");if(p){p.src=draft.img;p.style.display="block"}};im.src=r.result};r.readAsDataURL(f)}
async function addOffer(){
 const g=draft.g.trim(),q=draft.q.trim(),p=parseInt(draft.p,10);
 if(!g)return toast("اكتب اسم اللعبة");if(!/^\d+$/.test(q))return toast("كمية الجواهر أرقام فقط");if(!(p>0))return toast("اكتب عدد النقاط");
 await db.collection("offers").add({g,q,p,img:draft.img||"",t:Date.now()});
 draft={g:"",q:"",p:"",img:""};toast("تمت إضافة العرض");render();
}
function delOffer(id){modal(`<h2>تحذف هذا العرض؟</h2><button class="b r" onclick="doDel('${id}')">حذف</button><button class="b g" onclick="modal()">إلغاء</button>`)}
async function doDel(id){modal();await db.doc("offers/"+id).delete();toast("تم حذف العرض")}
function delAll(){modal(`<h2>تحذف كل طلبات البيع؟</h2><div class="red" style="font-size:12px;margin:6px 0">بيختفوا من عند العملاء كمان، والطلبات اللي لسا "جاري الإرسال" ما بترجع نقاطها.</div><button class="b r" onclick="doDelAll()">إي، احذف الكل</button><button class="b g" onclick="modal()">إلغاء</button>`)}
async function doDelAll(){modal();const l=[...O];await Promise.all(l.map(o=>db.doc("orders/"+o.id).delete()));toast("تم حذف كل الطلبات")}
async function setS(p){await db.doc("settings/main").set({...S,...p})}
async function decide(id,ok){
 const o=O.find(x=>x.id===id);if(!o||o.st!=="جاري الإرسال")return;
 await db.doc("orders/"+id).update({st:ok?"تم الشحن":"مرفوض"});
 if(!ok&&U[o.ck])await db.doc("users/"+o.ck).update({points:(U[o.ck].points||0)+o.pts});
}
async function addPts(){
 const id=$("#aid").value.trim(),n=parseInt($("#apt").value,10);
 const k=Object.keys(U).find(x=>U[x].id===id);
 if(!k)return toast("المعرف غير موجود");if(!(n>0))return toast("اكتب عدد صحيح");
 await db.doc("users/"+k).update({points:(U[k].points||0)+n});toast("تمت الإضافة");$("#aid").value="";$("#apt").value="";
}

function ownerView(){
 const pend=DR.filter(d=>!(U[d.k]&&U[d.k].role==="dist"&&U[d.k].approved));
 const dists=Object.keys(U).filter(k=>U[k].role==="dist"&&U[k].approved);
 $("#app").innerHTML=`<div class="top"><span>لوحة المالك</span><button onclick="ownerOpen=false;render()">رجوع</button></div>
 <div class="card"><h2>طلبات الموزعين</h2>${pend.length?pend.map(d=>`<div class="row" style="padding:6px 0"><span>${esc(d.email)}</span><span><button class="s" style="background:var(--ok)" onclick="approve('${d.k}')">موافقة</button> <button class="s" style="background:var(--red)" onclick="dropReq('${d.k}')">حذف</button></span></div>`).join(""):'<div class="mut center">ما في طلبات</div>'}
 <div class="mut" style="margin-top:6px">الموزع لازم يكون عامل حساب عميل أولاً بنفس الايميل.</div></div>
 <div class="card"><h2>الموزعين الحاليين</h2>${dists.length?dists.map(k=>`<div class="row" style="padding:6px 0"><span>${esc(U[k].email)}</span><button class="s" style="background:var(--red)" onclick="revoke('${k}')">إلغاء</button></div>`).join(""):'<div class="mut center">لا يوجد</div>'}</div>
 <div class="card"><h2>كل الحسابات</h2>${Object.keys(U).length?Object.keys(U).sort((a,b)=>(U[a].t||0)-(U[b].t||0)).map(k=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="row"><span style="direction:ltr">${esc(U[k].email)}</span><span class="pill">${U[k].role==="dist"?"موزع":"عميل"}</span></div><div class="row" style="margin-top:6px"><input id="id_${k}" value="${esc(U[k].id)}" inputmode="numeric" style="margin:0"><button class="s" onclick="setId('${k}')">حفظ المعرف</button></div></div>`).join(""):'<div class="mut center">لا يوجد حسابات</div>'}</div>`;
}
async function setId(k){
 const v=$("#id_"+k).value.trim();
 if(!/^\d{3,8}$/.test(v))return toast("المعرف أرقام فقط (3 إلى 8)");
 if(U[k].id===v)return;
 try{await db.doc("ids/"+v).set({k})}catch(e){return toast("المعرف مستخدم لحساب ثاني")}
 const old=U[k].id;await db.doc("users/"+k).update({id:v});try{await db.doc("ids/"+old).delete()}catch(e){}toast("تم تغيير المعرف");
}
async function approve(k){
 if(!U[k])return toast("لازم ينشئ حساب عميل أولاً");
 await db.doc("users/"+k).update({role:"dist",approved:true});await db.doc("distreq/"+k).delete();toast("تمت الموافقة");
}
async function dropReq(k){await db.doc("distreq/"+k).delete()}
async function revoke(k){await db.doc("users/"+k).update({role:"cust",approved:false})}

window.addEventListener("unhandledrejection",e=>{console.error(e.reason);toast("ما زبطت العملية، جرب مرة ثانية")});
let auth=null,busy=false,priv=false,unsubs=[],ownOrdersUnsub=null;
const idle=()=>!(document.activeElement&&document.activeElement.tagName==="INPUT")&&!$("#modal").classList.contains("on");
const re=()=>{if(me&&view==="app"&&idle())render()};
function stop(){unsubs.forEach(f=>f());unsubs=[];if(ownOrdersUnsub){ownOrdersUnsub();ownOrdersUnsub=null}priv=false;U={};O=[];DR=[];OF=[]}
function fail(x){
 console.error(x);const c=(x&&(x.code||x.message))||"";
 $("#app").innerHTML='<h1>صار خطأ</h1><div class="card center">تعذر تحميل حسابك<br><span class="mut" style="direction:ltr;display:block;margin-top:6px">'+esc(c)+'</span><button class="b" onclick="logout()">خروج</button></div>';
}
async function onUser(fu){
 stop();
 if(!fu){me=null;isOwner=false;ownerOpen=false;view="login";return render()}
 try{await ensureUser(fu.uid,fu.email)}catch(x){me=null;return fail(x)}
 me=fu.uid;isOwner=(fu.email||"").toLowerCase()===String(window.APP_CONFIG.ownerEmail||"").toLowerCase();view="app";
 unsubs.push(db.collection("offers").onSnapshot(s=>{OF=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.t||0)-(b.t||0));re()}));
 unsubs.push(db.doc("settings/main").onSnapshot(s=>{if(s.exists)S={...S,...s.data()};re()}));
 ownOrdersUnsub=db.collection("orders").where("ck","==",me).onSnapshot(s=>{O=s.docs.map(d=>({...d.data(),id:d.id}));re()});
 unsubs.push(db.doc("users/"+me).onSnapshot(s=>{
  const first=!U[me];if(s.exists)U[me]=s.data();const u=U[me];
  if(!priv&&(isOwner||(u&&u.role==="dist"&&u.approved)))startPriv();
  if(first)render();else re();
 },fail));
 render();
}
function startPriv(){
 priv=true;if(ownOrdersUnsub){ownOrdersUnsub();ownOrdersUnsub=null}
 unsubs.push(db.collection("users").onSnapshot(s=>{U={};s.docs.forEach(d=>U[d.id]=d.data());re()}));
 unsubs.push(db.collection("orders").onSnapshot(s=>{O=s.docs.map(d=>({...d.data(),id:d.id}));re()}));
 if(isOwner)unsubs.push(db.collection("distreq").onSnapshot(s=>{DR=s.docs.map(d=>({...d.data(),k:d.id}));re()}));
}
(function(){
 const C=window.APP_CONFIG;
 ready=true;
 if(!C||!C.firebase||String(C.firebase.apiKey).startsWith("PASTE")){db=null;return render()}
 firebase.initializeApp(C.firebase);auth=firebase.auth();db=firebase.firestore();
 render();
 auth.onAuthStateChanged(fu=>{if(busy)return;if(fu)onUser(fu);else if(me||view==="app")onUser(null)});
})();
</script>
</body>
</html>
